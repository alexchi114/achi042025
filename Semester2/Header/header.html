<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
    <style>
        /* Mobile first */
        body {
            margin: 0;
            padding: 0;
        }

        #pageheader {
            background-color: azure;
            padding: 1rem;
            border-bottom: solid rgb(255, 250, 190);

        }

        #logo {
            width: 100px;
            height: 100px;
            background-color: palevioletred;
            border-radius: 50%;
            border: 2px solid black;
            margin: auto;
            margin-bottom: 1rem;
            display: block;
        }

        #pageheader nav {
            /* background-color: rgb(191, 230, 191); */
            padding: 1rem;

        }

        #pageheader ul {
            background-color: none;
            list-style-type: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: .5rem;
            width: 80%;
            margin: auto;

        }

        #pageheader li {
            text-align: center;
            padding: 1rem;
            border: 1px solid rgb(253, 249, 207);
            color: rgb(202, 255, 202);
            border-radius: .5rem;
            background-color: rgb(235, 161, 185);
        }

        /* Tablet and Desktop design */
        @media screen and (min-width:700px) {
            #pageheader {

                display: flex;
                justify-content: space-between;
            }

            #logo {
                margin: 0;
            }

            #pageheader ul {
                flex-direction: row;
                width: 100%;

            }
        }
    </style>
</head>

<body>
    <header id="pageheader">
        <img id="logo" src="Images/paws_logo.png" alt="Paws Logo">
        <nav>
            <ul>
                <li>Home</li>
                <li>Why Adopt</li>
                <li>Pet Gallery</li>
                <li>Testimonials</li>
            </ul>
        </nav>
    </header>
</body>

</html>
