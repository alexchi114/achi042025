<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Photo Gallery</title>

    <style>
        h1 {
            text-align: center;
        }

        .gallery {
            background-color: paleturquoise;
            border: 4px solid azure;
            width: 90%;
            max-width: 1200px;
            margin: auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        figure {
            background-color: lightskyblue;
            width: 100%;
            max-width: 250px;
            padding: 1rem;
            margin: 1rem;
        }

        figcaption {
            text-align: center;
            color: black;
            padding: .5rem;
        }

        img {
            width: 100%;
            aspect-ratio: 1/1;
        }
    </style>
</head>


<body>
    <h1>Flexbox Photo Gallery</h1>

    <div class="gallery">
        <figure> <img src="https://picsum.photos/300/300/?random=1" alt="random picsum image">
            <figcaption>roll description</figcaption>
        </figure>
        <figure> <img src="https://picsum.photos/300/300/?random=2" alt="random picsum image">
            <figcaption>maybe description</figcaption>
        </figure>
        <figure> <img src="https://picsum.photos/300/300/?random=3" alt="random picsum image">
            <figcaption>again? description</figcaption>
        </figure>
        <figure> <img src="https://picsum.photos/300/300/?random=4" alt="random picsum image">
            <figcaption>snake eyes description</figcaption>
        </figure>
        <figure> <img src="https://picsum.photos/300/300/?random=5" alt="random picsum image">
            <figcaption>all out description</figcaption>
        </figure>
        <figure> <img src="https://picsum.photos/300/300/?random=6" alt="random picsum image">
            <figcaption>royal flush description</figcaption>
        </figure>
        <figure> <img src="https://picsum.photos/300/300/?random=7&greyscale" alt="random picsum image">
            <figcaption>double down description</figcaption>
        </figure>
        <figure> <img src="https://picsum.photos/300/300/?random=8&blur=10" alt="random picsum image">
            <figcaption>supa blur description</figcaption>
        </figure>
        <figure> <img src="https://picsum.photos/300/300/?random=9&greyscale" alt="random picsum image">
            <figcaption>heart description</figcaption>
        </figure>
        <figure> <img src="https://picsum.photos/300/300/?random=10&blur" alt="random picsum image">
            <figcaption>hello description</figcaption>
        </figure>
    </div>
</body>

</html>
